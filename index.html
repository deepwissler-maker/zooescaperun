<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZooEscapeRun - Jeu Vidéo 2D</title>
  <link rel="stylesheet" href="styles/base.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-overlay">
      <div id="start-screen" class="screen">
        <h1 class="game-title">ZOO ESCAPE RUN</h1>
        <p class="subtitle">Propulse-toi vers la liberté avec ton Soda Jetpack !</p>
        <button id="btn-play" class="btn-primary">JOUER</button>
        <p class="controls-hint">Appuie sur [ESPACE] ou [CLIC] pour propulser l'animal</p>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
